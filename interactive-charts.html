<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MachOptDB Interactive Charts</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#17243a}.top{background:linear-gradient(110deg,#172e83,#0878a9);color:white;padding:28px 5%}.top h1{margin:0 0 6px}.filters{background:white;padding:15px 5%;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #dde5ef}.filters select,.filters button{padding:10px;border:1px solid #d5deea;border-radius:8px;background:white}.filters button{cursor:pointer}.grid{max-width:1300px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #e2e8f1;border-radius:16px;padding:20px}.chart{height:320px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><h1>Interactive Machining Analytics</h1><div>Live data from MachOptDB</div></div><div class="filters"><select id="wp"><option value="">All Workpieces</option></select><select id="tool"><option value="">All Tools</option></select><button onclick="draw()">Apply Filters</button><button onclick="location='index.html'">Dashboard</button></div><div id="status" style="padding:15px 5%;color:#71809a">Loading...</div><div class="grid">
<div class="card"><h3>Tool Wear vs Experiment</h3><div class="chart"><canvas id="c1"></canvas></div></div>
<div class="card"><h3>MRR vs Feed Rate</h3><div class="chart"><canvas id="c2"></canvas></div></div>
<div class="card"><h3>Energy Consumption</h3><div class="chart"><canvas id="c3"></canvas></div></div>
<div class="card"><h3>Machining Cost</h3><div class="chart"><canvas id="c4"></canvas></div></div></div>
<script>
let rows=[],cs=[];async function init(){try{let j=await(await fetch("/api/experiments")).json();rows=j.data||[];for(let x of [...new Set(rows.map(x=>x.Workpiece_ID))])wp.add(new Option(x,x));for(let x of [...new Set(rows.map(x=>x.Tool_ID))])tool.add(new Option(x,x));draw()}catch(e){status.textContent="API error. Keep node server.js running."}}
function draw(){cs.forEach(x=>x.destroy());let a=rows.filter(x=>(!wp.value||x.Workpiece_ID==wp.value)&&(!tool.value||x.Tool_ID==tool.value));status.textContent=`Showing ${a.length} experiment(s)`;let mk=(id,type,labels,data,label)=>cs.push(new Chart(document.getElementById(id),{type,data:{labels,datasets:[{label,data,borderWidth:2,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true}}}}));mk("c1","line",a.map(x=>x.Experiment_ID),a.map(x=>+x.Tool_Wear_mm),"Tool wear (mm)");cs.push(new Chart(c2,{type:"scatter",data:{datasets:[{label:"MRR vs Feed Rate",data:a.map(x=>({x:+x.Feed_Rate_mm_min,y:+x.Material_Removal_Rate_cm3_min})),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{title:{display:true,text:"Feed rate (mm/min)"}},y:{title:{display:true,text:"MRR (cm³/min)"}}}}}));mk("c3","bar",a.map(x=>x.Experiment_ID),a.map(x=>+x.Energy_Consumed_kWh),"Energy (kWh)");mk("c4","bar",a.map(x=>x.Experiment_ID),a.map(x=>+x.Total_Cost),"Cost (₹)")}init();
</script></body></html>
