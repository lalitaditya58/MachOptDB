<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MachOptDB Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial;background:linear-gradient(135deg,#071b2b,#0878a9);color:#17243a}.box{width:400px;max-width:92%;background:white;padding:36px;border-radius:20px;box-shadow:0 25px 70px #0006}.logo{font-size:30px;font-weight:800;color:#0878a9}.sub{color:#71809a;margin:7px 0 25px}label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d7dfeb;border-radius:9px}button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:9px;background:#0878a9;color:white;font-weight:bold;font-size:15px}.hint{font-size:12px;color:#71809a;margin-top:18px;line-height:1.6}.err{color:#c62828;margin-top:10px;display:none}</style></head><body><div class="box"><div class="logo">M MachOptDB</div><div class="sub">CNC Machining Analytics System</div><form id="f"><label>Role</label><select id="r"><option>Admin</option><option>Operator</option><option>Viewer</option></select><label>Username</label><input id="u" required><label>Password</label><input id="p" type="password" required><button>Sign In</button><div id="e" class="err">Invalid credentials</div></form><div class="hint">Admin: admin / admin123<br>Operator: operator / operator123<br>Viewer: viewer / viewer123</div></div><script>
const a={Admin:["admin","admin123"],Operator:["operator","operator123"],Viewer:["viewer","viewer123"]};f.onsubmit=x=>{x.preventDefault();let v=a[r.value];if(u.value===v[0]&&p.value===v[1]){localStorage.machoptUser=JSON.stringify({role:r.value,username:u.value});location="index.html"}else e.style.display="block"};</script></body></html>
